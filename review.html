{% extends "base.html" %}
{% block content %}
<h2>Leave Review</h2>
<form method="POST">
    <label for="rating">Rating (1-5):</label>
    <input type="number" name="rating" min="1" max="5" required>
    
    <label for="comment">Comment:</label>
    <textarea name="comment" rows="4" required></textarea>
    
    <button type="submit">Submit Review</button>
</form>
{% endblock %}
